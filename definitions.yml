
project_name: Asset & Resource Allocation Management System

definitions:

 Office_Admin:
    description: >
      An office-level authority who reviews asset requests from users.
      The office admin can approve or reject requests and escalate
      them to the Higher Authority when needed.

Higher_Authority:
    description: >
      A senior authority responsible for handling escalated requests.
      This role focuses on approvals, monitoring request history,
      and overall supervision without performing operational tasks.

System_Admin:
    description: >
      A system-level administrator who manages users, roles, and access.
      This role controls permissions, manages offices, and maintains
      system audit records.

Asset:
    description: >
      Any organizational resource such as computers, equipment, or
      infrastructure that can be allocated, tracked, and maintained.


      


